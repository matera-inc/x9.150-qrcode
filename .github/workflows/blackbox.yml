name: Black-box

# Runs the black-box suite (others/blackbox) against the image, on PostgreSQL 16 with db/changelog
# applied by Liquibase (Story 9.1), on every pull request to main that touches the code, db/, the
# contract or the suite: the image as `make image` builds it, the movable clock on, and the
# black-box truststore, with the suite inside the service's network namespace so the service can
# reach the suite's test payee and CRL server. The verdict is the whole suite (Story 10.8): a suite
# that could not run fails this job (the service never healthy, zero tests collected, or any
# capability missing with X9_REQUIRE_ALL), never a green skip.
#
# A job-level path filter, in plain git, so the check always reports (it is required): on any other
# pull request it checks out, finds nothing to run, and passes.
#
# Until 3.0.0 this workflow also ran the suite against the Java build (`blackbox`) and diffed the
# two builds' answers (`differential`, ADR-0028). Both ended with Java's retirement (ADR-0039); the
# comparison can still be re-run against the java-final image (others/blackbox/README.md).

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  blackbox-go:
    name: blackbox-go
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Does this pull request touch the code, db/, the contract or the suite?
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          changed="$(git diff --name-only "$BASE_SHA"...HEAD)"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -Eq \
              '(\.go$|^go\.(mod|sum)$|^cmd/|^internal/|^testdata/|^api/|^Dockerfile$|^\.dockerignore$|^Makefile$|^db/|^others/blackbox/|^\.github/workflows/blackbox\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Neither the code, db/, the contract nor the suite changed: the black-box run is not needed."
          fi

      - name: Build the image (make image)
        if: steps.changes.outputs.run == 'true'
        run: make image IMAGE=x9-qrcode:ci

      - name: Run the whole black-box suite against it (PostgreSQL 16, Liquibase)
        if: steps.changes.outputs.run == 'true'
        env:
          X9_IMAGE: x9-qrcode:ci
        run: ./others/blackbox/deployment/run-against-image.sh
