name: CI

# Builds and runs the full test suite on every pull request to main.
# Combined with branch protection (this "build" check is required), a PR
# cannot merge unless the suite is green — the automated gate that replaces
# manual "I ran the tests locally" trust.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # Tests use Testcontainers (MongoDB); Docker is preinstalled and
      # running on ubuntu-latest runners, so no extra service setup is needed.
      - name: Build and test
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp clean test
