name: Pairings

# Two instances of the service pay each other (Story 11.3, S11.3-AC2): the image is built as the
# `blackbox-go` job builds it, and others/demo/two-instance-payment-cycle.sh runs a whole payment
# between two instances (create, decode and payload fetch, pre-commit, post-commit, PAID, events),
# each side verifying every signed message of the other. A cycle that does not complete fails the
# job, naming the step.
#
# Until 3.0.0 this ran all four pairings of the Java and Go builds; the Java build is retired
# (ADR-0039), so it runs Go→Go.
#
# A job-level path filter, as in blackbox-go, so the check always reports: on a pull request that
# touches neither the code, db/, the demo nor the suite, it checks out, finds nothing to run, and
# passes.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  pairings:
    name: pairings
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Does this pull request touch the code, db/, the demo or the suite?
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          changed="$(git diff --name-only "$BASE_SHA"...HEAD)"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -Eq \
              '(\.go$|^go\.(mod|sum)$|^cmd/|^internal/|^Dockerfile$|^\.dockerignore$|^Makefile$|^db/|^others/demo/|^others/blackbox/|^\.github/workflows/pairings\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Nothing the service depends on changed: the pairing is not needed."
          fi

      - name: Build the image (make image)
        if: steps.changes.outputs.run == 'true'
        run: make image IMAGE=x9-qrcode:ci

      - name: Run the payment cycle between two instances
        if: steps.changes.outputs.run == 'true'
        env:
          IMAGE: x9-qrcode:ci
        run: ./others/demo/two-instance-payment-cycle.sh
