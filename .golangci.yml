# The Go lint configuration: the only one in the repository. Run it with
#   go tool golangci-lint run ./...
# A //nolint must name the linter and give its reason.

version: "2"

linters:
  default: standard
  enable:
    - forbidigo   # banned identifiers, below
  settings:
    forbidigo:
      analyze-types: true
      forbid:
        # ADR-0033: one business clock. internal/clock is the only place that reads the wall clock.
        - pattern: ^time\.(Now|Since|Until|After|Tick|NewTimer)$
          msg: >-
            business time comes from internal/clock (ADR-0033). Measuring a real duration (latency,
            a timeout) may use it with //nolint:forbidigo // <what it measures>
  exclusions:
    rules:
      - path: ^internal/clock/
        linters: [forbidigo]
