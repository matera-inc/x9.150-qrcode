#
# The Go build's configuration (ADR-0031): this one YAML file, plus the environment variables named
# beside each key, which take precedence over it. Pass the file with `-config <path>` or
# X9_CONFIG_FILE; without one, the environment alone must supply every required key.
#
# The service validates everything at start and refuses to start on any problem, naming the key and
# its variable. Keys marked REQUIRED have no default, on purpose: a database host, a credential or a
# TLS mode is never guessed. Unknown keys are refused, so a typo is not silently ignored.
#
# The Java build's configuration (Spring YAML, application-secrets.yml, Jasypt ENC(…), SPRING_* or
# MongoDB variables) is refused at start. docs/CONFIGURATION-FROM-JAVA.md maps each Java setting to its
# key here, or says why it is dropped; there is no converter (ADR-0038).

server:
  port: 8080                     # X9_SERVER_PORT. API and health share it, as in the Java build.
  shutdown-delay-seconds: 5      # X9_SERVER_SHUTDOWNDELAYSECONDS. Readiness is DOWN this long
                                 # after SIGTERM before new connections are refused.

public-endpoints:
  host: x9-150.example.com       # X9_PUBLICENDPOINTS_HOST. The public host, no scheme, written into
                                 # every QR Code's location URL and every jku/x5u. Default
                                 # x9-150.example.com, the Java build's placeholder: set your own
                                 # for real scans. At most 37 characters (EMV tag 26), printable
                                 # ASCII, no space; set to empty, it is refused at start.
  jws-ttl-seconds: 300           # X9_PUBLICENDPOINTS_JWSTTLSECONDS. The ttl of every JWS this service
                                 # signs; the header carries it in milliseconds (300000).
  jws-clock-skew-seconds: 60     # X9_JWS_CLOCK_SKEW_SECONDS (the Java build's variable). How far ahead
                                 # of this service's clock a received JWS's iat may be (FUTURE_IAT).
                                 # 0 allows no drift; a negative value is read as 0, as in Java.

database:
  host: postgres.example.com     # DATABASE_HOST            REQUIRED
  port: 5432                     # DATABASE_PORT
  name: bank                     # DATABASE_NAME            REQUIRED
  user: x9_qrcode_app            # DATABASE_USER            REQUIRED: the application role (db/README.md)
  # One of the two, REQUIRED. The file is re-read on every new connection, so rotating the
  # credential is a file change and a reconnect.
  # password: …                  # DATABASE_PASSWORD
  password-file: /run/secrets/x9-qrcode-db-password   # DATABASE_PASSWORD_FILE
  schema: x9_qrcode              # DATABASE_SCHEMA. The application role's search_path must select it.
  sslmode: verify-full           # DATABASE_SSLMODE         REQUIRED: disable, allow, prefer, require,
                                 #                          verify-ca or verify-full (recommended)
  sslrootcert: /etc/x9-qrcode/db-ca.pem   # DATABASE_SSLROOTCERT, REQUIRED for verify-ca / verify-full
  pool-writes: 8                 # DATABASE_POOL_WRITES. Writes and reads together are the ceiling
  pool-reads: 4                  # DATABASE_POOL_READS   of connections this service opens (12).
  query-exec-mode: ""            # DATABASE_QUERY_EXEC_MODE. Empty is pgx's default; "exec" behind a
                                 # PgBouncer older than 1.21 or with max_prepared_statements=0.

log:
  level: info                    # X9_LOG_LEVEL: debug, info, warn or error. The log is JSON.

reservation:
  ttl-seconds: 90                # X9_RESERVATION_TTL_SECONDS. 0 = no window; negative is invalid.

# Retention (ADR-0029), the service's one background job. Durations are ISO-8601 days, hours, minutes
# and seconds (P30D, PT1H, P1DT12H); years and months are refused. Each run deletes, on the business
# clock and in small batches, first the events older than events.retention, then the QR Codes whose
# validUntil and last revision are both older than qrcode.retention, in any status, with their audit
# log and stored notifications. Nothing else is ever deleted, and no status is ever changed.
# Start-up is refused if qrcode.retention is shorter than events.retention, naming both.
# Sizing (BENCHMARK.md, "Database"): about 15 KB of PostgreSQL per payment: the QR Code row ~1.4 KB
# and its signed notifications ~12.6 KB, both kept for qrcode.retention, and the events and indexes
# the remaining ~1.3 KB. 10,000 payments a day kept P400D is therefore about 60 GB.
events:
  retention: P30D                # X9_EVENTS_RETENTION. An event older than this is deleted: a consumer of
                                 # GET /pub/api/v1/events or of the table must read it before then.
qrcode:
  retention: P400D               # X9_QRCODE_RETENTION. An expired QR Code stays readable (with its expiry
                                 # reason) until then, and a payee can still mark it paid; afterwards it
                                 # is a 404. Shorten it to use less storage.
retention:
  interval: PT1H                 # X9_RETENTION_INTERVAL. Real time between the end of one run and the
                                 # start of the next. A run that fails is logged and retried then.

# The currencies this deployment accepts, and which may appear together (INTERPRETATION I-3): the Java
# build's x9.currency.* keys and files. Empty: the files bundled with the service (USD, USDC and FRNT,
# all in one dollar peg group). A path replaces one; each is strict JSON, read at start.
currency:
  supported-currencies-location: ""  # X9_CURRENCY_SUPPORTEDCURRENCIESLOCATION. {"supported": ["USD", …]};
                                     # an empty list accepts every currency.
  pegged-currencies-location: ""     # X9_CURRENCY_PEGGEDCURRENCIESLOCATION. {"groups": [["USD", "USDC"], …]}

# The signing key and the truststore (ADR-0027, ADR-0031): the Java build's x9.certificate.* keys and
# variables. A location is a path (Spring's file: prefix is accepted); left empty, the bundled DEMO
# identity is used, as in Java: NON-PRODUCTION, its private key is public, and a WARN says so.
# The file's content decides its format: PEM (one unencrypted private key, RSA or EC, and its
# certificate, in one file) or PKCS#12 (keytool's and OpenSSL's, AES or legacy 3DES / RC2). A JKS
# or JCEKS file is refused: convert it with keytool, as docs/CONFIGURATION-FROM-JAVA.md shows.
# An ENC(…) value is refused: pass the plain secret from the environment or a mounted file (same
# document). HSM / provider settings are refused.
certificate:
  endpoint-type: JWK_SET         # X9_CERTIFICATE_ENDPOINTTYPE. Where a signed JWS says the certificate is:
                                 #   JWK_SET (jku, https://<host>/pub/.well-known/jwks), PEM (x5u,
                                 #   https://<host>/pub/.well-known/certificate/x9-key.pem) or NONE (the
                                 #   chain itself, in x5c). Every JWS also carries x5t#S256.
  jwk-algorithm: ""              # X9_CERTIFICATE_JWKALGORITHM. RS256/384/512 or PS256/384/512 for an RSA
                                 #   key; ES256 (P-256), ES384 (P-384) or ES512 (P-521) for an EC key.
                                 #   Empty: ES256 with the bundled demo identity (EC P-256), PS512 with
                                 #   your own keystore (ADR-0040). An algorithm the key cannot sign with
                                 #   is refused at start.
  issuer-name: X9                # X9_CERTIFICATE_ISSUERNAME. A counterpart's chain must end at a trust
                                 #   anchor whose issuer contains this, ignoring case; empty skips the check.
  private-keystore:
    location: ""                 # X9_CERTIFICATE_PRIVATEKEYSTORE_LOCATION. Empty: the bundled demo.
    type: ""                     # X9_CERTIFICATE_PRIVATEKEYSTORE_TYPE. Informative: PKCS12, PEM or JKS
                                 #   (Java's default name); PKCS11 is refused.
    password: ""                 # X9_CERTIFICATE_PRIVATEKEYSTORE_PASSWORD (PKCS#12)
    private-key-password: ""     # X9_CERTIFICATE_PRIVATEKEYSTORE_PRIVATEKEYPASSWORD. Empty, or equal to
                                 #   the password: a PKCS#12 file has one password.
    alias: x9-private-keystore   # X9_CERTIFICATE_PRIVATEKEYSTORE_ALIAS. Names the keystore in logs.
    enforced-alias: ""           # X9_CERTIFICATE_PRIVATEKEYSTORE_ENFORCEDALIAS. Accepted, not checked (a WARN says so):
                                 #   the file must hold exactly one private key.
  truststore:
    location: ""                 # X9_CERTIFICATE_TRUSTSTORE_LOCATION. Empty: the bundled demo truststore.
    type: ""                     # X9_CERTIFICATE_TRUSTSTORE_TYPE
    password: ""                 # X9_CERTIFICATE_TRUSTSTORE_PASSWORD (PKCS#12)
    alias: x9-truststore         # X9_CERTIFICATE_TRUSTSTORE_ALIAS. Names the truststore in logs.

keystore:
  reload:
    frequency: 30000             # KEYSTORE_RELOAD_FREQUENCY, in milliseconds, as in Java. Both files
                                 # are re-read this often; a file that fails to read leaves the last
                                 # good keys in use, and the error is logged.

testing:
  clock-control: false           # X9_TESTING_CLOCKCONTROL. The movable test clock (ADR-0033), for test
                                 # deployments only: start-up refuses it unless the signing certificate
                                 # is one bundled with this repository (its private key is public).
  clock-listen: 127.0.0.1:8099   # X9_TESTING_CLOCKLISTEN. host:port of /test/clock's own listener;
                                 # never the API port. Read only when clock-control is true.
