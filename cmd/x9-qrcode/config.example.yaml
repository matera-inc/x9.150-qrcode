#
# The Go build's configuration (ADR-0031): this one YAML file, plus the environment variables named
# beside each key, which take precedence over it. Pass the file with `-config <path>` or
# X9_CONFIG_FILE; without one, the environment alone must supply every required key.
#
# The service validates everything at start and refuses to start on any problem, naming the key and
# its variable. Keys marked REQUIRED have no default, on purpose: a host, a credential or a TLS mode
# is never guessed. Unknown keys are refused, so a typo is not silently ignored.
#
# The Java build's configuration (Spring YAML, application-secrets.yml, Jasypt ENC(…), SPRING_* or
# MongoDB variables) is refused at start: convert it with x9-config-convert.

server:
  port: 8080                     # X9_SERVER_PORT. API and health share it, as in the Java build.
  shutdown-delay-seconds: 5      # X9_SERVER_SHUTDOWNDELAYSECONDS. Readiness is DOWN this long
                                 # after SIGTERM before new connections are refused.

public-endpoints:
  host: x9-150.example.com       # X9_PUBLICENDPOINTS_HOST. The public host, no scheme, written into
                                 # every QR Code's location URL. At most 37 characters, or the URL
                                 # would not fit EMV tag 26: a longer host is refused at start.

database:
  host: postgres.example.com     # DATABASE_HOST            REQUIRED
  port: 5432                     # DATABASE_PORT
  name: bank                     # DATABASE_NAME            REQUIRED
  user: x9_qrcode_app            # DATABASE_USER            REQUIRED: the application role (db/README.md)
  # One of the two, REQUIRED. The file is re-read on every new connection, so rotating the
  # credential is a file change and a reconnect.
  # password: …                  # DATABASE_PASSWORD
  password-file: /run/secrets/x9-qrcode-db-password   # DATABASE_PASSWORD_FILE
  schema: x9_qrcode              # DATABASE_SCHEMA. The application role's search_path must select it.
  sslmode: verify-full           # DATABASE_SSLMODE         REQUIRED: disable, allow, prefer, require,
                                 #                          verify-ca or verify-full (recommended)
  sslrootcert: /etc/x9-qrcode/db-ca.pem   # DATABASE_SSLROOTCERT, REQUIRED for verify-ca / verify-full
  pool-writes: 8                 # DATABASE_POOL_WRITES. Writes and reads together are the ceiling
  pool-reads: 4                  # DATABASE_POOL_READS   of connections this service opens (12).
  query-exec-mode: ""            # DATABASE_QUERY_EXEC_MODE. Empty is pgx's default; "exec" behind a
                                 # PgBouncer older than 1.21 or with max_prepared_statements=0.

log:
  level: info                    # X9_LOG_LEVEL: debug, info, warn or error. The log is JSON.

reservation:
  ttl-seconds: 90                # X9_RESERVATION_TTL_SECONDS. 0 = no window; negative is invalid.

# The signing key and the truststore (ADR-0027, ADR-0031): the Java build's x9.certificate.* keys and
# variables. A location is a path (Spring's file: prefix is accepted); left empty, the bundled DEMO
# identity is used, as in Java: NON-PRODUCTION, its private key is public, and a WARN says so.
# The file's content decides its format: PEM (one unencrypted private key, RSA or EC, and its
# certificate, in one file) or PKCS#12. A JKS file is refused: convert it with x9-config-convert.
# PKCS#12 is not readable yet in this build: convert it with `openssl pkcs12 -in f.p12 -nodes -out f.pem`.
# An ENC(…) value is refused: x9-config-convert decrypts it once. HSM / provider settings are refused.
certificate:
  private-keystore:
    location: ""                 # X9_CERTIFICATE_PRIVATEKEYSTORE_LOCATION. Empty: the bundled demo.
    type: ""                     # X9_CERTIFICATE_PRIVATEKEYSTORE_TYPE. Informative: PKCS12, PEM or JKS
                                 #   (Java's default name); PKCS11 is refused.
    password: ""                 # X9_CERTIFICATE_PRIVATEKEYSTORE_PASSWORD (PKCS#12)
    private-key-password: ""     # X9_CERTIFICATE_PRIVATEKEYSTORE_PRIVATEKEYPASSWORD (PKCS#12; defaults
                                 #   to the password)
    alias: x9-private-keystore   # X9_CERTIFICATE_PRIVATEKEYSTORE_ALIAS. Names the keystore in logs.
    enforced-alias: ""           # X9_CERTIFICATE_PRIVATEKEYSTORE_ENFORCEDALIAS. The PKCS#12 entry to sign
                                 #   with; without it the file must hold exactly one private key.
  truststore:
    location: ""                 # X9_CERTIFICATE_TRUSTSTORE_LOCATION. Empty: the bundled demo truststore.
    type: ""                     # X9_CERTIFICATE_TRUSTSTORE_TYPE
    password: ""                 # X9_CERTIFICATE_TRUSTSTORE_PASSWORD (PKCS#12)
    alias: x9-truststore         # X9_CERTIFICATE_TRUSTSTORE_ALIAS. Names the truststore in logs.

keystore:
  reload:
    frequency: 30000             # KEYSTORE_RELOAD_FREQUENCY, in milliseconds, as in Java. Both files
                                 # are re-read this often; a file that fails to read leaves the last
                                 # good keys in use, and the error is logged.

testing:
  clock-control: false           # X9_TESTING_CLOCKCONTROL. Must stay false in this build: the movable
                                 # test clock (ADR-0033) arrives with the signing keys.
