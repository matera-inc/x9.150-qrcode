#
# The Go build on PostgreSQL, on a clean machine (Story 14.2). One command, nothing to install but
# Docker. The Java build's Compose files (docker-compose.yml, docker-compose.prod.yml) are separate
# and unchanged; this file becomes the default only at the cutover (Epic 16).
#
#   make go-up                                        # build the images, start, wait for health UP
#   docker compose -f docker-compose.go.yml up -d --build --wait     # by hand (needs BuildKit/buildx)
#   curl -s localhost:8080/actuator/health            # {"status":"UP"}
#   make go-down                                      # stop and throw the database away
#   X9_IMAGE=x9-qrcode:go make go-up                  # run an image you already have instead
#
# The services start in this order, each only after the one before it has finished well:
#
#   postgres    PostgreSQL 16, pinned. Healthy once pg_isready answers. Not published to the host.
#   bootstrap   the DBA's one-time step (db/local/bootstrap.sql): the owner role and the schema it
#               owns. A one-shot; runs again harmlessly on the next `up`.
#   liquibase   Liquibase 4.33.0 (Apache-2.0, ADR-0031) applies db/changelog as the owner role,
#               which creates the application, read-only and event-reader roles (db/README.md).
#               A one-shot; on the next `up` it finds nothing to apply and exits 0.
#   x9-qrcode   the Go build, connected as the application role, never as the owner (ADR-0032).
#               Starts only after liquibase exited 0 (`service_completed_successfully`), so it never
#               meets a schema without its latest changeset, which it would refuse at start. Healthy
#               once its own /actuator/health answers 200 (`x9-qrcode -healthcheck`: the distroless
#               image has no shell or curl).
#
# The X9 signing identity is the image's bundled demo identity (NON-PRODUCTION): no keystore is
# configured, so `docker compose up` needs no secret. Nothing here is a production setting.
#
# LOCAL USE ONLY. The database trusts every connection on the Compose network and has no password;
# DATABASE_PASSWORD below is a placeholder the Go build requires to be set, not a credential. The
# database is never published to the host; to look at it:
#   docker compose -f docker-compose.go.yml exec postgres psql -U x9_qrcode_readonly postgres
name: x9-qrcode-go

services:
  postgres:
    image: postgres:16.14
    environment:
      # Local only: trust authentication, no password anywhere (as db/docker-compose.yml).
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - x9-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  bootstrap:
    image: x9-qrcode-db-bootstrap:local
    build:
      context: ./db
      dockerfile: local/bootstrap.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    command: ["psql", "-X", "-q", "-h", "postgres", "-U", "postgres", "-v", "owner=x9_qrcode_owner",
              "-v", "schema=x9_qrcode", "-f", "/x9/bootstrap.sql"]

  liquibase:
    image: x9-qrcode-db-liquibase:local
    build:
      context: ./db
      dockerfile: local/liquibase.Dockerfile
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    environment:
      LIQUIBASE_SEARCH_PATH: /liquibase/x9
      LIQUIBASE_COMMAND_CHANGELOG_FILE: changelog/db.changelog-master.yaml
      LIQUIBASE_COMMAND_URL: jdbc:postgresql://postgres:5432/postgres
      LIQUIBASE_COMMAND_USERNAME: x9_qrcode_owner
      LIQUIBASE_COMMAND_DEFAULT_SCHEMA_NAME: x9_qrcode
      LIQUIBASE_LIQUIBASE_SCHEMA_NAME: x9_qrcode
      LIQUIBASE_SHOW_BANNER: "false"
    command: ["update"]

  x9-qrcode:
    # Built from the repository's Dockerfile unless X9_IMAGE names an image you already have.
    # `make go-up` builds it with `make go-image` (which also works without buildx), then runs it;
    # `make go-up X9_IMAGE=…` runs that image without building anything.
    image: "${X9_IMAGE:-x9-qrcode:go}"
    build:
      context: .
      args:
        VERSION: "${X9_VERSION:-dev}"
        REVISION: "${X9_REVISION:-unknown}"
    depends_on:
      liquibase:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${X9_PORT:-8080}:8080"
    environment:
      DATABASE_HOST: postgres
      DATABASE_NAME: postgres
      DATABASE_USER: x9_qrcode_app
      # LOCAL ONLY: a placeholder. The database trusts the Compose network, but the Go build requires
      # a credential to be set. A real deployment reads it from a file (DATABASE_PASSWORD_FILE).
      DATABASE_PASSWORD: local-only-unused
      DATABASE_SSLMODE: disable
      # No scheme, at most 37 characters (ENDPOINTS.md). The default is the placeholder the service
      # warns about: QR Codes printed with it point payers at a host that is not this one.
      X9_PUBLICENDPOINTS_HOST: "${X9_PUBLICENDPOINTS_HOST:-x9-150.example.com}"
      X9_LOG_LEVEL: "${X9_LOG_LEVEL:-info}"
      # The Go runtime's own memory cap (ADR-0031), 80% of the limit below.
      GOMEMLIMIT: 410MiB
    healthcheck:
      test: ["CMD", "/x9-qrcode", "-healthcheck"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 512m

volumes:
  x9-pgdata:
