# The Java build under test (S5.1-AC4): 2 vCPU / 2 GiB, requests equal to limits, as shipped (virtual
# threads and the container-aware JVM; no JVM flags added). The image is the git-<sha> tag that
# collect.sh substitutes for APP_IMAGE; imagePullPolicy Never, so it must have been loaded into the
# cluster's runtime (see README, "Images") and is never pulled from a registry.
#
# Configuration is the black-box suite's (others/blackbox/deployment/docker-compose.yml) minus the
# test clock, which is OFF: the shipped demo signing key (PS512, JWK_SET), and a truststore holding
# the test CA, so the k6 payers are trusted. Their certificates name a CRL distribution point on
# 127.0.0.1:18081; the `crl` sidecar serves the test CA's CRL there, inside this pod, so revocation
# is checked for real and no request leaves the pod. It has its own small limits, outside the
# app's 2 vCPU.
apiVersion: v1
kind: Service
metadata:
  name: x9-qrcode
  labels: {app.kubernetes.io/name: x9-qrcode, app.kubernetes.io/part-of: x9-bench, x9-bench/stage: app}
spec:
  selector: {app.kubernetes.io/name: x9-qrcode}
  ports:
    - {name: http, port: 8080, targetPort: 8080}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: x9-qrcode
  labels: {app.kubernetes.io/name: x9-qrcode, app.kubernetes.io/part-of: x9-bench, x9-bench/role: app, x9-bench/stage: app}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: x9-qrcode}
  template:
    metadata:
      labels: {app.kubernetes.io/name: x9-qrcode, app.kubernetes.io/part-of: x9-bench, x9-bench/role: app, x9-bench/stage: app}
    spec:
      automountServiceAccountToken: false
      initContainers:
        # A native sidecar (Kubernetes 1.29+): started before the app, kept running beside it.
        - name: crl
          image: python:3.13.9-slim
          imagePullPolicy: IfNotPresent
          restartPolicy: Always
          command: ["python3", "-m", "http.server", "18081", "--bind", "127.0.0.1", "--directory", "/crl"]
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 100m, memory: 64Mi}
          volumeMounts:
            - {name: crl, mountPath: /crl, readOnly: true}
      containers:
        - name: app
          image: APP_IMAGE
          imagePullPolicy: Never
          ports:
            - {name: http, containerPort: 8080}
          env:
            - {name: SPRING_DATA_MONGODB_URI, value: "mongodb://mongo-0.mongo:27017/x9-qrcode?replicaSet=rs0&w=majority&journal=true"}
            - {name: X9_PUBLICENDPOINTS_HOST, value: "x9-150.example.com"}
            - {name: X9_TESTING_CLOCKCONTROL, value: "false"}
            - {name: X9_CERTIFICATE_TRUSTSTORE_LOCATION, value: "file:/x9-bench/truststore/x9-blackbox-truststore.jks"}
            - {name: X9_CERTIFICATE_TRUSTSTORE_PASSWORD, value: "x9test123"}
            - {name: X9_CERTIFICATE_TRUSTSTORE_ALIAS, value: "x9-test-ca"}
            # Run as the image runs anywhere else, the same as in footprint.sh: Spring must not
            # detect Kubernetes, or the application.yml document for it imports configuration from
            # the Kubernetes API, which this pod has no account for. And no Kubernetes health
            # indicator (the Helm chart says why: it drags the aggregate health DOWN without RBAC).
            - {name: SPRING_MAIN_CLOUD_PLATFORM, value: NONE}
            - {name: SPRING_CLOUD_KUBERNETES_ENABLED, value: "false"}
            - {name: MANAGEMENT_HEALTH_KUBERNETES_ENABLED, value: "false"}
            - {name: SPRING_CLOUD_DISCOVERY_CLIENT_COMPOSITEINDICATOR_ENABLED, value: "false"}
          resources:
            requests: {cpu: "2", memory: 2Gi}
            limits: {cpu: "2", memory: 2Gi}
          readinessProbe:
            httpGet: {path: /actuator/health, port: 8080}
            periodSeconds: 2
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - {name: truststore, mountPath: /x9-bench/truststore, readOnly: true}
      volumes:
        - name: crl
          configMap: {name: x9-bench-crl}
        - name: truststore
          configMap: {name: x9-bench-truststore}
