# Java + MongoDB (S5.1-AC4). Applied by collect.sh into a fresh namespace per run, in two stages
# selected by the label x9-bench/stage: database, then app. The ConfigMaps x9-bench-crl and
# x9-bench-truststore (from prepare.sh's build/) are made first.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - mongo.yaml
  - app.yaml
