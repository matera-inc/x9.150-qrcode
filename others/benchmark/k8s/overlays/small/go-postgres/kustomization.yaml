# SMOKE ONLY — never a measurement. The go-postgres manifests scaled down like
# overlays/small/java-mongo: app 1 vCPU / 1 GiB (GOMEMLIMIT 80% of it), database 0.5 vCPU / 512 MiB,
# volume 1 GiB.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../go-postgres
patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: x9-qrcode}
      spec:
        template:
          spec:
            containers:
              - name: app
                env:
                  - {name: GOMEMLIMIT, value: 819MiB}
                resources:
                  requests: {cpu: "1", memory: 1Gi}
                  limits: {cpu: "1", memory: 1Gi}
  - patch: |-
      apiVersion: apps/v1
      kind: StatefulSet
      metadata: {name: postgres}
      spec:
        template:
          spec:
            containers:
              - name: database
                resources:
                  requests: {cpu: 500m, memory: 512Mi}
                  limits: {cpu: 500m, memory: 512Mi}
        volumeClaimTemplates:
          - metadata: {name: data}
            spec:
              accessModes: ["ReadWriteOnce"]
              resources:
                requests: {storage: 1Gi}
