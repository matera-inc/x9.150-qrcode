# SMOKE ONLY — never a measurement. The java-mongo manifests scaled down to fit a small local
# cluster (a laptop VM of 4 vCPU / 4 GiB), to check the harness end to end. Results taken with
# this overlay say so in their resources.json and are not comparable with anything.
#   app 1 vCPU / 1 GiB, database 0.5 vCPU / 512 MiB, volume 1 GiB.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../java-mongo
patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: x9-qrcode}
      spec:
        template:
          spec:
            containers:
              - name: app
                resources:
                  requests: {cpu: "1", memory: 1Gi}
                  limits: {cpu: "1", memory: 1Gi}
  - patch: |-
      apiVersion: apps/v1
      kind: StatefulSet
      metadata: {name: mongo}
      spec:
        template:
          spec:
            containers:
              - name: database
                resources:
                  requests: {cpu: 500m, memory: 512Mi}
                  limits: {cpu: 500m, memory: 512Mi}
        volumeClaimTemplates:
          - metadata: {name: data}
            spec:
              accessModes: ["ReadWriteOnce"]
              resources:
                requests: {storage: 1Gi}
