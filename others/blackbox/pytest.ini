[pytest]
testpaths = tests
addopts = -ra
markers =
    serial: moves the shared test clock (ADR-0033); runs on its own, never in parallel, and resets the clock
    java_only: pins a behaviour of the Java build that the Go build does not share
    go_only: pins a behaviour of the Go build that the Java build does not share
    runs_last: changes what every other test would see (the retention purge of X9-TIME-015); moved to the end of the session by conftest.py, whatever the file order
