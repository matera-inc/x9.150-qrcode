# HTTPS for the two public hosts of a two-instance-payment-cycle.sh pairing (Story 11.3). Each host
# is a network alias of this container and is proxied to its instance's plain-HTTP port. The
# instances advertise their public host themselves (X9_PUBLICENDPOINTS_HOST), so nothing here
# rewrites a URL. The access log names the host, so the script can check what crossed the wire.
events {}

http {
    log_format x9 'x9-wire $host "$request" $status';
    access_log /dev/stdout x9;
    ssl_certificate     /etc/nginx/x9/tls.pem;
    ssl_certificate_key /etc/nginx/x9/tls.key;
    proxy_read_timeout  60s;
    proxy_set_header    Host              $host;
    proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header    X-Forwarded-Proto https;

    server {
        listen 443 ssl;
        server_name payee.x9demo.test;
        location / { proxy_pass http://payee:8080; }
    }

    server {
        listen 443 ssl;
        server_name payer.x9demo.test;
        location / { proxy_pass http://payer:8080; }
    }
}
