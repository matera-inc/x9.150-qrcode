{{- /*
The service's Deployment (Story 14.3; the only one since the Java build was retired at 3.0.0,
ADR-0039). What it renders, and why (ADR-0031, ADR-0032):
  - one instance and `Recreate`: the old pod is gone before the new one starts, so two instances
    never overlap and an old binary never meets a newer schema. No HPA;
  - Liquibase 4.33.0 as an init container, as the schema owner, before the service starts;
  - the service connects as the application role; its password is a file mounted from a Secret
    (DATABASE_PASSWORD_FILE), re-read on every new connection, never a value of this chart;
  - only the Go build's variables; SPRING_*, MONGO* and JASYPT_* are refused at render time;
  - probes on the API port: the Go build has no management port;
  - no preStop hook: the distroless image has no shell, and the binary itself keeps readiness down
    for go.shutdownDelaySeconds before it stops accepting connections.
*/ -}}
{{- include "x9-qrcode.validateGo" . }}
{{- $db := .Values.go.database }}
{{- $lb := .Values.go.liquibase }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "x9-qrcode.fullname" . }}
  labels:
    {{- include "x9-qrcode.labels" . | nindent 4 }}
  {{- with .Values.deploymentAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  # One active instance (ADR-0031): never scaled, never two at once.
  replicas: 1
  selector:
    matchLabels:
      {{- include "x9-qrcode.selectorLabels" . | nindent 6 }}
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        {{- if $lb.enabled }}
        # A new changelog restarts the pod, so the init container applies it.
        checksum/changelog: {{ include (print $.Template.BasePath "/configmap-changelog.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "x9-qrcode.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "x9-qrcode.serviceAccountName" . }}
      # The Go build never calls the Kubernetes API.
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.deploymentStrategy.terminationGracePeriodSeconds }}
      {{- if or $lb.enabled .Values.initContainers }}
      initContainers:
        {{- if $lb.enabled }}
        # The schema first (ADR-0031): db/changelog, applied as the owner role. Liquibase holds its
        # own lock, finds nothing to do when the schema is current, and a failure stops the pod
        # here, before the service starts.
        - name: liquibase
          image: {{ $lb.image | quote }}
          imagePullPolicy: {{ $lb.pullPolicy }}
          args:
            - update
            - "-Dx9.schema={{ $db.schema }}"
            - "-Dx9.role.owner={{ $lb.owner }}"
            - "-Dx9.role.app={{ $db.user }}"
            - "-Dx9.role.readonly={{ $lb.roles.readonly }}"
            - "-Dx9.role.event_reader={{ $lb.roles.eventReader }}"
          env:
            - name: LIQUIBASE_COMMAND_URL
              value: {{ include "x9-qrcode.liquibaseUrl" . | quote }}
            - name: LIQUIBASE_COMMAND_USERNAME
              value: {{ $lb.owner | quote }}
            - name: LIQUIBASE_COMMAND_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $lb.existingSecret | default .Values.go.existingSecret }}
                  key: {{ $lb.passwordKey }}
            - name: LIQUIBASE_SEARCH_PATH
              value: /liquibase/x9
            - name: LIQUIBASE_COMMAND_CHANGELOG_FILE
              value: changelog/db.changelog-master.yaml
            - name: LIQUIBASE_COMMAND_DEFAULT_SCHEMA_NAME
              value: {{ $db.schema | quote }}
            - name: LIQUIBASE_LIQUIBASE_SCHEMA_NAME
              value: {{ $db.schema | quote }}
            - name: LIQUIBASE_SHOW_BANNER
              value: "false"
            - name: JAVA_OPTS
              value: {{ $lb.javaOpts | quote }}
          securityContext:
            {{- toYaml $lb.securityContext | nindent 12 }}
          resources:
            {{- toYaml $lb.resources | nindent 12 }}
          volumeMounts:
            - name: changelog
              mountPath: /liquibase/x9/changelog
              readOnly: true
            {{- if $db.caSecret }}
            - name: database-ca
              mountPath: /etc/x9/database-ca
              readOnly: true
            {{- end }}
        {{- end }}
        {{- with .Values.initContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      containers:
        - name: {{ include "x9-qrcode.fullname" . }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: {{ include "x9-qrcode.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.deploy.ports.containerPort }}
              protocol: TCP
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- include "x9-qrcode.calculateResourcesBlock" . | nindent 10 }}
          # The Go build's variables only (docs/CONFIGURATION-FROM-JAVA.md).
          env:
            - name: GOMEMLIMIT
              value: {{ include "x9-qrcode.goMemLimit" . | quote }}
            - name: X9_SERVER_PORT
              value: {{ .Values.deploy.ports.containerPort | quote }}
            - name: X9_SERVER_SHUTDOWNDELAYSECONDS
              value: {{ .Values.go.shutdownDelaySeconds | quote }}
            - name: DATABASE_HOST
              value: {{ required "go.database.host is required" $db.host | quote }}
            - name: DATABASE_PORT
              value: {{ $db.port | quote }}
            - name: DATABASE_NAME
              value: {{ required "go.database.name is required" $db.name | quote }}
            - name: DATABASE_USER
              value: {{ required "go.database.user is required" $db.user | quote }}
            - name: DATABASE_PASSWORD_FILE
              value: /etc/x9/database/password
            - name: DATABASE_SCHEMA
              value: {{ $db.schema | quote }}
            - name: DATABASE_SSLMODE
              value: {{ required "go.database.sslmode is required" $db.sslmode | quote }}
            {{- if $db.caSecret }}
            - name: DATABASE_SSLROOTCERT
              value: "/etc/x9/database-ca/{{ $db.caSecretKey }}"
            {{- end }}
            - name: DATABASE_POOL_WRITES
              value: {{ $db.poolWrites | quote }}
            - name: DATABASE_POOL_READS
              value: {{ $db.poolReads | quote }}
            {{- with $db.queryExecMode }}
            - name: DATABASE_QUERY_EXEC_MODE
              value: {{ . | quote }}
            {{- end }}
            - name: X9_PUBLICENDPOINTS_HOST
              value: {{ required "The '.Values.application.x9.public-endpoints.host' is required! See documentation for more details!" (dig "x9" "public-endpoints" "host" nil .Values.application) | quote }}
            # 0 means no window: a reservation never expires on its own (ADR-0036).
            - name: X9_RESERVATION_TTL_SECONDS
              value: {{ dig "x9" "reservation" "ttl-seconds" 90 .Values.application | quote }}
            {{- with (dig "x9" "certificate" "private-keystore" "location" nil .Values.application) }}
            - name: X9_CERTIFICATE_PRIVATEKEYSTORE_LOCATION
              value: {{ . | quote }}
            {{- end }}
            {{- with (dig "x9" "certificate" "truststore" "location" nil .Values.application) }}
            - name: X9_CERTIFICATE_TRUSTSTORE_LOCATION
              value: {{ . | quote }}
            {{- end }}
            # The keystore passwords, from the same Secret; a key that is absent leaves the variable
            # unset (the bundled demo identity needs none).
            - name: X9_CERTIFICATE_PRIVATEKEYSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.go.existingSecret }}
                  key: {{ .Values.go.secretKeys.privateKeystorePassword }}
                  optional: true
            - name: X9_CERTIFICATE_PRIVATEKEYSTORE_PRIVATEKEYPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.go.existingSecret }}
                  key: {{ .Values.go.secretKeys.privateKeyPassword }}
                  optional: true
            - name: X9_CERTIFICATE_TRUSTSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.go.existingSecret }}
                  key: {{ .Values.go.secretKeys.truststorePassword }}
                  optional: true
            {{- with .Values.go.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- with .Values.customerEnvs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: database-password
              mountPath: /etc/x9/database
              readOnly: true
            {{- if $db.caSecret }}
            - name: database-ca
              mountPath: /etc/x9/database-ca
              readOnly: true
            {{- end }}
            {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        {{- with .Values.sidecars }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      volumes:
        - name: database-password
          secret:
            secretName: {{ .Values.go.existingSecret }}
            defaultMode: 0440
            items:
              - key: {{ .Values.go.secretKeys.databasePassword }}
                path: password
        {{- if $db.caSecret }}
        - name: database-ca
          secret:
            secretName: {{ $db.caSecret }}
            items:
              - key: {{ $db.caSecretKey }}
                path: {{ $db.caSecretKey }}
        {{- end }}
        {{- if $lb.enabled }}
        - name: changelog
          configMap:
            name: {{ include "x9-qrcode.fullname" . }}-changelog
            items:
              {{- range $path, $_ := .Files.Glob "files/changelog/**" }}
              {{- $rel := trimPrefix "files/changelog/" $path }}
              - key: {{ $rel | replace "/" "__" }}
                path: {{ $rel }}
              {{- end }}
        {{- end }}
        {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
