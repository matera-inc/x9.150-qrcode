{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "x9-qrcode.serviceAccountName" . }}
  labels:
    {{- include "x9-qrcode.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}

---

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "x9-qrcode.fullname" . }}-read-config
subjects:
  - kind: ServiceAccount
    name: {{ include "x9-qrcode.serviceAccountName" . }}
roleRef:
  kind: Role
  name: {{ include "x9-qrcode.fullname" . }}-config-reader
  apiGroup: rbac.authorization.k8s.io
{{- end }}