# The Go build (PostgreSQL), layered over values.yaml (Story 14.3):
#
#   helm upgrade --install x9-qrcode others/helm/x9-qrcode/chart -n <namespace> \
#     -f others/helm/x9-qrcode/chart/values-go.yaml -f <your-values>.yaml
#
# The Java build stays the chart's default until the cutover (Epic 16). Every variable this renders
# is the Go build's (docs/CONFIGURATION-FROM-JAVA.md); SPRING_*, MONGO* and JASYPT_* are refused.
#
# Before installing:
#   1. The database is yours (ADR-0032): the chart ships no PostgreSQL. Your DBA creates the owner
#      role and the schema once (db/README.md, "Installing it in your database"), and sets the
#      application role's password after the first Liquibase run (or creates the roles beforehand).
#   2. Create the Secret named in go.existingSecret; the chart never takes a password as a value:
#        kubectl -n <namespace> create secret generic x9-qrcode-go \
#          --from-file=database-password=<file> --from-file=liquibase-password=<file>
#      plus private-keystore-password and truststore-password if you mount your own keystores.

runtime: go

image:
  repository: "registry.example.com/x9-qrcode"
  # -- The tag of the Go image (`make go-image` builds x9-qrcode:go). Required: the chart's
  # appVersion names a Java image. Nothing is published to Docker Hub before the cutover.
  tag: "go"

# One active instance, never two at once (ADR-0031). The chart forces both for the Go build, and
# refuses a replicaCount other than 1 or autoscaling.enabled: true.
replicaCount: 1
autoscaling:
  enabled: false
deploymentStrategy:
  type: Recreate
  # Above go.shutdownDelaySeconds (5) plus the 20 s drain (ADR-0031).
  terminationGracePeriodSeconds: 60

# distroless nonroot (65532); the root filesystem is never written.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  # Lets the service read the mounted password file (mode 0440).
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# The same health paths as the Java build, on the API port: the Go build has no management port.
livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: http
  periodSeconds: 5
  timeoutSeconds: 5
  initialDelaySeconds: 0
  failureThreshold: 5
readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: http
  periodSeconds: 5
  timeoutSeconds: 5
  initialDelaySeconds: 0
  failureThreshold: 3
startupProbe:
  httpGet:
    path: /actuator/health/liveness
    port: http
  periodSeconds: 2
  timeoutSeconds: 5
  initialDelaySeconds: 0
  failureThreshold: 30

# Lighter than the JVM. GOMEMLIMIT is go.memLimitPercent (80%) of the memory limit.
resources:
  strategy: critical
  limits:
    cpu: 500m
    memory: 256Mi

application:
  x9:
    public-endpoints:
      # -- This deployment's public host, without a scheme, at most 37 characters (ENDPOINTS.md).
      host: "x9.example.com"
    certificate:
      # Empty: the image's bundled demo identity (NON-PRODUCTION). For your own, mount a PKCS#12 or
      # PEM file (volumes/volumeMounts) and name it here; JKS is refused (CONFIGURATION-FROM-JAVA.md).
      private-keystore:
        location: ""
      truststore:
        location: ""

go:
  existingSecret: x9-qrcode-go
  database:
    host: "postgres.example.com"
    name: "x9"
    sslmode: verify-full
  env:
    - name: X9_LOG_LEVEL
      value: info
