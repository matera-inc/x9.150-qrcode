# Minimal values file for a quick installation: the three required values, and nothing else. A
# starting point for development environments; values.yaml documents every other setting.
#
# Before installing, your DBA creates the owner role and the schema (db/README.md), and you create
# the Secret named in go.existingSecret (x9-qrcode-go by default) with database-password and
# liquibase-password. The chart never takes a password as a value.
#
# NOTICE: with no keystore configured, the service signs with the image's bundled demo identity,
# which is NON-PRODUCTION: its private key is public.

application:
  x9:
    public-endpoints:
      # No scheme, at most 37 characters (ENDPOINTS.md).
      host: "x9.example.com"

go:
  database:
    host: "postgres.example.com"
    name: "x9"
