# Default values for x9-qrcode.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# -- Which build this release deploys: `java` (Spring Boot on MongoDB, the default until the
# cutover) or `go` (PostgreSQL). Deploy the Go build with `-f values-go.yaml`, which sets this and
# the `go` section below; see the chart README.
runtime: java

image:
  repository: "registry.example.com/x9-qrcode"
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets:
  - name: registry-credentials

# Resource naming overrides
nameOverride: "x9-qrcode"
fullnameOverride: "x9-qrcode"

podAnnotations: {}
podLabels: {}
deploymentAnnotations: {}

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podSecurityContext: {}
# fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
# runAsUser: 1000

# Deployment update strategy
deploymentStrategy:
  # -- Defines the Deployment update strategy:
  # - RollingUpdate: Performs a gradual update by creating new pods before removing old ones.
  # - Recreate: Removes all existing pods before creating new ones.
  type: RollingUpdate

  # Configuration for the RollingUpdate strategy.
  # This section is ignored if 'type' is set to 'Recreate'.
  rollingUpdate:
    # -- Specifies the maximum number of Pods that can be created above the desired count.
    # It can be an absolute number (e.g., 1) or a percentage (e.g., "25%").
    # Kubernetes default: "25%"
    maxSurge: 25%

    # -- Specifies the maximum number of Pods that can be unavailable during the update.
    # It can be an absolute number (e.g., 1) or a percentage (e.g., "25%").
    # Kubernetes default: "25%"
    maxUnavailable: 25%

  # -- Time in seconds to wait before forcing pod termination.
  terminationGracePeriodSeconds: 120

  # -- Pre-stop time to finish current transactions before graceful shutdown starts
  preStop:
    sleep: 15

# Runtime Matera environment variables
environment:
  env:
    - name: SPRING_CONFIG_LOCATION
      value: "classpath:/,/workspace/app-config/"

# -- Custom environment variables injected in addition to defaults.
customerEnvs:
# - name: TEST_VAR_A
#   value: "test A"
# - name: TEST_VAR_B
#   value: "test B"

# -- Allows including one or more initContainers for pod preparation or initial setup.
initContainers: []
# Example:
# - name: init-busybox
#   image: busybox
#   command: ['sh', '-c', 'echo "Running InitContainer" && sleep 5']
# - name: init-check-db
#   image: busybox
#   command: ['sh', '-c', 'until nc -z db-service 5432; do echo "Waiting for DB..."; sleep 2; done']

# -- List of optional sidecars to be added to the pod.
sidecars: []
# Example:
# - name: sidecar-logger
#   image: busybox
#   command: ["sh", "-c", "tail -F /var/log/app.log"]
#   volumeMounts:
#     - name: log-volume
#       mountPath: /var/log

# Service exposure
service:
  # -- Type of Service to be created.
  type: ClusterIP
  # -- Port where the Service will listen.
  port: 8080


# Defines deployment ports.
deploy:
  ports:
    # -- Port for the application endpoint.
    containerPort: 8080
    # -- Port for the management (actuator) endpoint.
    managementPort: 12345

# Optional ingress exposure
ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
  # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

# livenessProbe configuration to verify container health.
livenessProbe:
  httpGet:
    # -- Path used to verify container health.
    path: /actuator/health/liveness
    # -- Port where the health check service is running.
    port: 12345
  # -- Interval in seconds between health checks.
  periodSeconds: 5
  # -- Maximum time in seconds to wait for the livenessProbe response.
  timeoutSeconds: 5
  # -- Initial delay in seconds before starting health checks.
  initialDelaySeconds: 10
  # -- Number of consecutive failures before considering the container unhealthy.
  failureThreshold: 5

# readinessProbe configuration to verify whether the container is ready to receive traffic.
readinessProbe:
  # If this check fails, Kubernetes does not send traffic to the container.
  # The same options as livenessProbe can be used here.
  # The difference is that readinessProbe does not restart the container; it only prevents traffic until it is ready.
  httpGet:
    # -- Path used to verify whether the container is ready to receive traffic.
    path: /actuator/health/readiness
    # -- Port where the health check service is running.
    port: 12345
  # -- Interval in seconds between readiness checks.
  periodSeconds: 5
  # -- Maximum time in seconds to wait for the readinessProbe response.
  timeoutSeconds: 5
  # -- Initial delay in seconds before starting readiness checks.
  initialDelaySeconds: 10
  # -- Number of consecutive failures before considering the container unhealthy.
  failureThreshold: 5

# startupProbe configuration to verify whether the application started correctly.
startupProbe:
  # The container is only considered ready after startupProbe succeeds; if it fails, Kubernetes restarts the container.
  # The same options as livenessProbe can be used here.
  # Useful for slow-starting containers, allowing more tolerant checks before considering failure.
  httpGet:
    # -- Path used to verify whether the application started.
    path: /actuator/health/liveness
    # -- Port where the health check service is running.
    port: 12345
  # -- Interval in seconds between startup checks.
  periodSeconds: 5
  # -- Maximum time in seconds to wait for the startupProbe response.
  timeoutSeconds: 5
  # -- Initial delay in seconds before starting startup checks.
  initialDelaySeconds: 10
  # -- Number of consecutive failures before considering the container not started.
  failureThreshold: 50

# -- Number of replicas to be deployed.
replicaCount: 1

# -- Horizontal autoscaling
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

# Container resources
resources:
  limits:
    # -- Defines the maximum CPU value the container can consume.
    cpu: 1000m
    # -- Defines the maximum memory value the container can consume.
    memory: 1024Mi

  # -- Allocation strategy: "critical" or "optimized"
  # - critical: requests == limits (Guaranteed QoS, maximum robustness)
  #   • Does NOT allow requests override
  # - optimized: requests = limits × requestsPercentages (Burstable QoS, resource optimization)
  #   • requests calculated from requestsPercentages OR manual override
  strategy: critical

  # -- Memory and CPU request percentages relative to limits
  # Used only when strategy is "optimized" and resources.requests is not defined.
  # IMPORTANT: Change only under Matera guidance.
  requestsPercentages:
    # -- Memory request percentage relative to memory limits
    memory: 90
    # -- CPU request percentage relative to CPU limits
    cpu: 70

  # -- [OPTIONAL] Manual requests override
  # Valid only when strategy is "optimized".
  # If defined, it replaces calculations based on requestsPercentages.
  # requests:
  #   cpu: 50m
  #   memory: 128Mi

# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

# -- Allows scheduling pods on specific nodes based on labels.
nodeSelector: {}
#   kubernetes.io/hostname: "node1"  # Example label to select a specific node

# -- Allows scheduling pods on nodes with specific taints.
tolerations: []
  # - key: "example"
  #   operator: "Equal"
  #   value: "true"
#   effect: "NoSchedule"

# -- Allows scheduling pods on nodes with specific affinity rules.
affinity: {}
#   nodeAffinity:                                       # Affinity with specific nodes
#     requiredDuringSchedulingIgnoredDuringExecution:   # Mandatory during scheduling
#       nodeSelectorTerms:                              # List of node selection terms
#         - matchExpressions:                           # Expressions to match node labels
#             - key: kubernetes.io/az-name              # Node label name
#               operator: In                            # Comparison operator
#               values:                                 # Accepted values for the label
#                 - us-east-1a
#                 - us-east-1b

# -- Application base properties rendered to ConfigMap
# These values are non-sensitive and become runtime properties for Spring Boot.
# Keep this section focused on behavior/configuration (profiles, public hosts, keystore paths),
# and use `applicationExtra` only for environment-specific overrides.
application:
  # -- Log output format used by the application (e.g., json, text).
  loggingFormat: "json"
  x9:
    public-endpoints:
      # -- Public host used in X9 payload location and callback URLs.
      host:
    certificate:
      private-keystore:
        # -- Keystore location mounted in the container filesystem.
        location:
      truststore:
        # -- Truststore location mounted in the container filesystem.
        location:
    reservation:
      # -- Seconds a payer's pre-commit holds the QR Code before it lapses (X9_RESERVATION_TTL_SECONDS).
      # `90` suits simple installations. `0` means no window: a reservation never expires and ends
      # only by a refused retry, NOT_SENT, or the status-update API (a bank that wants full control).
      # Once a transaction hash is registered the reservation stops expiring whatever this says (ADR-0036).
      # A negative value is invalid: the service refuses to start.
      ttl-seconds: 90

# -- Extra application configuration rendered as application-kubernetes.yaml
applicationExtra: {}

# -- Secrets consumed by template secrets.yaml
# This section contains sensitive data and is rendered as Kubernetes Secret.
# Do not commit production secrets in source control. Prefer external secret managers
# or encrypted values files per environment.
secrets:
  configEncryption:
    # -- Enables Jasypt configs encryption support in runtime.
    enabled: true
    # -- Jasypt encryptor master password.
    password:
  spring:
    data:
      mongodb:
        # -- MongoDB connection URI (prefer TLS and auth in non-local environments).
        uri:
  x9:
    certificate:
      privateKeystore:
        # -- Password for the private keystore file.
        password:
        # -- Password for the private key alias inside the keystore.
        privateKeyPassword:
      truststore:
        # -- Password for the truststore used to validate certificate chains.
        password:

# -- The Go build (`runtime: go`, values-go.yaml); ignored by the Java build. Every variable it
# sets is listed in docs/CONFIGURATION-FROM-JAVA.md. `application.x9.*` above (public host, keystore
# locations, reservation window) feeds both builds.
go:
  # -- The Secret, created by you, never by the chart, that holds the passwords below. It must
  # exist before the release is installed.
  existingSecret: ""
  # -- The key of each password in `existingSecret`. The database password is required; the
  # keystore passwords may be absent (the image's bundled demo identity needs none).
  secretKeys:
    databasePassword: database-password
    privateKeystorePassword: private-keystore-password
    privateKeyPassword: private-key-password
    truststorePassword: truststore-password
  # The bank's own PostgreSQL (ADR-0032): the chart ships no database. Its roles and schema are
  # created once by the DBA, as db/README.md says.
  database:
    # -- PostgreSQL host (DATABASE_HOST). Required.
    host: ""
    # -- PostgreSQL port (DATABASE_PORT).
    port: 5432
    # -- Database name (DATABASE_NAME). Required.
    name: ""
    # -- The application role the service connects as (DATABASE_USER); never the owner.
    user: x9_qrcode_app
    # -- The schema (DATABASE_SCHEMA), also Liquibase's default and its own tables' schema.
    schema: x9_qrcode
    # -- TLS mode (DATABASE_SSLMODE), for the service and for Liquibase. `verify-full` is recommended.
    sslmode: verify-full
    # -- A Secret holding the CA certificate that signs the database's (DATABASE_SSLROOTCERT);
    # required by `verify-ca` and `verify-full` unless the database's certificate chains to a public CA.
    caSecret: ""
    # -- The key of that certificate in `caSecret`.
    caSecretKey: ca.crt
    # -- Connections for writes (DATABASE_POOL_WRITES).
    poolWrites: 8
    # -- Connections for reads (DATABASE_POOL_READS).
    poolReads: 4
    # -- `exec` behind PgBouncer older than 1.21 (DATABASE_QUERY_EXEC_MODE); empty is the default.
    queryExecMode: ""
  # Liquibase 4.33.0 (Apache-2.0, ADR-0031) as an init container: it applies db/changelog as the
  # owner role before the service starts, on every start (nothing to do when the schema is current).
  liquibase:
    # -- Run Liquibase before the service. Set false when your DBA applies the changelog (or the SQL
    # `liquibase update-sql` writes) by hand; the service then refuses to start on an older schema.
    enabled: true
    # -- The official image, pinned: 4.33.0 is the last Apache-2.0 release (ADR-0031).
    image: liquibase/liquibase:4.33.0
    pullPolicy: IfNotPresent
    # -- The owner role Liquibase connects as (db/README.md).
    owner: x9_qrcode_owner
    # -- The Secret with the owner's password; empty means `go.existingSecret`.
    existingSecret: ""
    # -- The key of the owner's password in that Secret.
    passwordKey: liquibase-password
    # The other roles the changelog creates, or uses if they exist (the application role is
    # `go.database.user`).
    roles:
      readonly: x9_qrcode_readonly
      eventReader: x9_qrcode_event_reader
    # -- Liquibase is a JVM; cap its heap within the container's limit.
    javaOpts: "-XX:MaxRAMPercentage=75"
    # -- The init container's resources (requests equal to limits keep the pod's QoS).
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 500m
        memory: 512Mi
    # -- The official image's user is liquibase (1001), and its directory is that user's only.
    securityContext:
      runAsNonRoot: true
      runAsUser: 1001
      runAsGroup: 1001
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
      seccompProfile:
        type: RuntimeDefault
  # -- GOMEMLIMIT as a percentage of `resources.limits.memory` (ADR-0031).
  memLimitPercent: 80
  # -- GOMEMLIMIT as given (e.g. `400MiB`), instead of the percentage.
  gomemlimit: ""
  # -- Seconds readiness is down before the service stops accepting connections, on SIGTERM
  # (X9_SERVER_SHUTDOWNDELAYSECONDS). `deploymentStrategy.terminationGracePeriodSeconds` must exceed
  # this plus the 20 s drain.
  shutdownDelaySeconds: 5
  # -- More Go variables, as `name`/`value` (X9_LOG_LEVEL, X9_EVENTS_RETENTION, …). A SPRING_*,
  # MONGO* or JASYPT_* name is refused when the chart renders, as the service would refuse it.
  env: []
