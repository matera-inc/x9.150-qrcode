info:
  app:
    name: '@project.artifactId@'
    description: '@project.description@'
    version: '@project.version@'

server:
  port: 8080
  shutdown: graceful
  max-http-request-header-size: 30KB

management:
  prometheus:
    metrics:
      enabled: true
      export:
        properties:
          io:
            prometheus:
              exporter:
                exemplarsOnAllMetricTypes: false
  tracing:
    propagation:
      type: b3
  health:
    mail:
      enabled: false
    rabbit:
      enabled: false
  endpoints:
    web:
      exposure:
        include: "*"
        exclude:
          - shutdown
          - heapdump
  endpoint:
    logfile:
      externalFile: /tmp/logs/x9-qrcode.log
    metrics:
      enabled: true
    prometheus:
      enabled: true
    health:
      probes:
        enabled: true
      show-details: when-authorized
    sbom:
      enabled: false
    env:
      show-values: when-authorized
      keys-to-sanitize:
        - password
        - secret
        - key
        - token
        - .credentials.
        - sun.java.command
        - EASTER_ID
    configprops:
      show-values: when-authorized
      keys-to-sanitize:
        - password
        - secret
        - key
        - token
        - .credentials.
        - sun.java.command
        - EASTER_ID

jasypt:
  encryptor:
    algorithm: PBEWithHmacSHA512AndAES_256

application:
  loggingFormat:
    logging: json

spring:
  config:
    import:
      # app runs from repo root (./secrets); tests run from the module dir (../secrets)
      - "optional:file:./secrets/application-secrets.yml"
      - "optional:file:../secrets/application-secrets.yml"
  data:
    mongodb:
      database: ${spring.application.name}
      auto-index-creation: true
      max-wait-time: 2500
      connection-timeout: 2500
      socket-timeout: 2500
  threads:
    virtual:
      enabled: true
  application:
    name: x9-qrcode
  main:
    allow-circular-references: false
  lifecycle:
    timeout-per-shutdown-phase: 20s
  jmx:
    enabled: false

x9:
  # How long a PAYMENT_INITIATED reservation holds before it stops counting.
  #
  # A reservation takes the QR Code out of circulation so two payers cannot pay one bill. If the
  # payer then vanishes, nothing releases it and the bill is unpayable by anybody until validUntil —
  # hours or days for a code that was held for seconds.
  #
  # Nothing is swept: the lapse is applied when somebody reads the status. See
  # QRCodeEntity.effectiveStatus.
  #
  # The window applies only before any transaction hash: once a post-commit is registered for the
  # QR Code the reservation stops expiring, whoever sent it, and only the payment system ends it
  # (status-update PAID, CANCELLED or ACTIVE). ADR-0036.
  #
  #   90 (default)  beginners and simple installations: a payer that vanishes cannot lock the QR
  #                 Code for longer than 90 s.
  #   0             no window: a bank that wants full control. A reservation never expires; it
  #                 ends only by a refused retry, NOT_SENT, or the status-update API. (0 used to
  #                 mean "expire at once".)
  #   other > 0     tuning, the same as the default with that window.
  #   negative      invalid: the service refuses to start.
  #
  # The same environment variable configures the Go build.
  reservation:
    ttl-seconds: ${X9_RESERVATION_TTL_SECONDS:90}

  # The movable test clock (ADR-0033). OFF by default and in production. When on, GET/PUT/DELETE
  # /test/clock is served on clock-listen — a separate listener, never the API port — and the app
  # refuses to start unless the signing certificate is a bundled demo or test-CA one.
  testing:
    clock-control: ${X9_TESTING_CLOCKCONTROL:false}
    clock-listen: ${X9_TESTING_CLOCKLISTEN:127.0.0.1:8099}

  public-endpoints:
    jws-ttl-seconds: 300
    # How far ahead of this service's clock a JWS's iat may be when we verify it. Beyond this, the
    # JWS is refused as dated in the future: a question gets a signed 401, a payee's answer is
    # reported INVALID with signatureProblem FUTURE_IAT. It forgives honest drift between two clocks;
    # a JWS dated further ahead would stretch its own iat + ttl window. Applies to every JWS this
    # service verifies, questions and answers alike. 0 allows no drift at all.
    jws-clock-skew-seconds: ${X9_JWS_CLOCK_SKEW_SECONDS:60}
    base-path: /pub
    certificate-path: ${x9.public-endpoints.base-path}/.well-known/certificate
    jwk-set-path: ${x9.public-endpoints.base-path}/.well-known/jwks
    payload-path: ${x9.public-endpoints.base-path}/api/v1/loc
    payment-notification-path: ${x9.public-endpoints.base-path}/api/v1/payment-notification
  certificate:
    issuer-name: X9
    certificate-supported-type: X.509
    endpoint-type: JWK_SET
    jwk-algorithm: PS512
    # Ships with a self-signed DEMO keystore (NON-PRODUCTION) so the app runs out of the box.
    # Override location + password for real X9-issued keys via secrets/application-secrets.yml
    # (git-ignored) or environment variables. See secrets/README.md.
    private-keystore:
      alias: x9-private-keystore
      location: classpath:/certificate/x9-demo.jks
      password: x9demo123
      private-key-password: x9demo123
    truststore:
      alias: x9-truststore
      location: classpath:/certificate/x9-demo-truststore.jks
      password: x9demo123

---
spring:
  config:
    activate:
      on-cloud-platform: kubernetes
    import:
      - "optional:kubernetes:"
  cloud:
    kubernetes:
      enabled: true
      secrets:
        enable-api: true

info:
  tags:
    pod: ${HOSTNAME}